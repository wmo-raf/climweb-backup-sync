services:

  # ---------------------------------------------------------------------------
  # Daily backup to Google Drive / OneDrive via rclone
  # Start with: docker compose up -d climweb-backup-rclone
  # ---------------------------------------------------------------------------
  climweb-backup-rclone:
    restart: always
    build:
      context: ./rclone
      dockerfile: Dockerfile
    container_name: climweb-backup-rclone
    env_file: .env
    volumes:
      - ${BACKUP_DIR}:/backup
      - ./rclone/config:/config

  # ---------------------------------------------------------------------------
  # Daily backup to another server via rsync over SSH
  # Start with: docker compose up -d climweb-backup-rsync
  # ---------------------------------------------------------------------------
  climweb-backup-rsync:
    restart: always
    build:
      context: ./rsync
      dockerfile: Dockerfile
    container_name: climweb-backup-rsync
    env_file: .env
    volumes:
      - ${BACKUP_DIR}:/backup
      - ~/.ssh:/root/.ssh:ro
      # - ${SSH_KEY_PATH}:/root/ssh:ro
